<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background w-full h-screen flex items-end justify-end p-4 font-body-compact text-on-surface">
<!-- Overlay / Dialog Container representing a system tray notification -->
<div class="bg-panel-bg border border-border-subtle rounded-lg shadow-lg w-[360px] flex flex-col overflow-hidden">
<!-- Header -->
<div class="flex items-center justify-between px-4 py-2 bg-surface-container-lowest border-b border-border-subtle">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">router</span>
<span class="font-app-name text-app-name text-text-primary">ProxySwitch</span>
</div>
<button class="text-text-secondary hover:text-text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Content Body -->
<div class="p-4 flex gap-4">
<div class="flex-shrink-0 pt-1">
<span class="material-symbols-outlined text-accent-v2ray text-[24px]" style="font-variation-settings: 'FILL' 1;">info</span>
</div>
<div class="flex flex-col gap-2">
<h3 class="font-section-header text-section-header text-text-primary">External Process Detected</h3>
<p class="font-body-compact text-body-compact text-text-secondary">
                    ProxySwitch detected an external launch of <span class="font-semibold text-text-primary">chrome.exe</span>. This application matches a saved routing profile.
                </p>
</div>
</div>
<!-- Actions -->
<div class="px-4 pb-4 pt-2 flex flex-col gap-2 bg-surface-container-lowest">
<button class="w-full flex items-center justify-center gap-2 bg-primary text-on-primary hover:bg-primary-container h-[28px] rounded transition-colors font-body-compact text-body-compact border border-transparent cursor-pointer">
<span class="material-symbols-outlined text-[14px]">shield</span>
                Attach &amp; Route <span class="opacity-75">(UAC)</span>
</button>
<div class="flex gap-2 w-full mt-1">
<button class="flex-1 bg-surface text-text-primary border border-border-subtle hover:bg-surface-variant h-[28px] rounded transition-colors font-body-compact text-body-compact cursor-pointer">
                    Ignore Once
                </button>
<button class="flex-1 bg-surface text-text-secondary border border-border-subtle hover:bg-surface-variant h-[28px] rounded transition-colors font-body-compact text-body-compact cursor-pointer">
                    Disable Auto-Attach
                </button>
</div>
</div>
</div>
</body></html>
